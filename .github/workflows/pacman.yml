name: Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # tous les jours à minuit UTC
  workflow_dispatch:        # permet de le lancer manuellement

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Pacman contribution graph
        uses: jkdevcode/github-pacman@output
        with:
          github_user_name: akmeonuzraa
          github_user_token: ${{ secrets.GITHUB_TOKEN }}
          theme: dark