name: Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Pacman contribution graph
        uses: jkdevcode/github-pacman@main
        with:
          github_user_name: akmeonuzraa
          github_user_token: ${{ secrets.GITHUB_TOKEN }}
          theme: dark
